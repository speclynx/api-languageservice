name: Release monorepo packages
on:
  workflow_dispatch:

env:
  CPU_CORES: 2
  HUSKY: 0

jobs:
  release:
    name: Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: npm-release
      url: https://www.npmjs.com/org/speclynx
    permissions:
      contents: write
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.3.1
          registry-url: https://registry.npmjs.org
      - name: Install monorepo dependencies
        run: npm ci --engine-strict=false
      - name: Build monorepo
        run: npm run build
      - name: Check TypeScript types
        run: npm run typescript:check-types
      - name: Execute tests in monorepo
        run: npm run test
      - name: Version bump & GitHub release
        run: |
          git config user.email "vladimir.gorej@gmail.com"
          git config user.name "Vladimir Gorej"
          npx lerna version --conventional-commits --no-private --yes --force-publish
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      - name: Read the released version
        id: version
        run: echo "version=$(node -p "require('./lerna.json').version")" >> "$GITHUB_OUTPUT"
      - name: Publish monorepo npm packages
        run: npx lerna publish from-package --no-private --yes

  # The SBOM is read from a scratch project that installs the version just
  # published from the registry and resolves its dependencies afresh, which runs
  # code no lockfile pins. That happens here, with a read-only token and no
  # secrets, and not in the job that can publish.
  sbom:
    name: SBOM
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout the release
        uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.3.1
      - name: Install monorepo dependencies
        run: npm ci --engine-strict=false
      # npm can serve a version some time after accepting its publish: it listed
      # 3.0.0 about 15 minutes after Lerna published it. This asks for the version
      # as the check does, bypassing npm's cache, until the registry has it.
      - name: Wait until the registry serves the release
        run: |
          for _ in $(seq 60); do
            npm pack --dry-run --prefer-online "@speclynx/api-languageservice@$VERSION" > /dev/null 2>&1 && exit 0
            echo "the registry does not serve $VERSION yet, asking again in 30 seconds"
            sleep 30
          done
          echo "::error::the registry did not serve $VERSION within 30 minutes"
          exit 1
        env:
          VERSION: ${{ needs.release.outputs.version }}
      - name: Check the published package and write its SBOM
        run: ./scripts/check-package-contract.sh
        env:
          PUBLISHED_VERSION: ${{ needs.release.outputs.version }}
          SBOM_TO: ${{ runner.temp }}/speclynx-api-languageservice-${{ needs.release.outputs.version }}.cdx.json
      - name: Keep the SBOM for the release
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: ${{ runner.temp }}/speclynx-api-languageservice-${{ needs.release.outputs.version }}.cdx.json
          if-no-files-found: error

  attach-sbom:
    name: Attach the SBOM
    needs: [release, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Fetch the SBOM
        uses: actions/download-artifact@v8
        with:
          name: sbom
      - name: Attach the SBOM to the GitHub release
        run: gh release upload "v$VERSION" "speclynx-api-languageservice-$VERSION.cdx.json" --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}

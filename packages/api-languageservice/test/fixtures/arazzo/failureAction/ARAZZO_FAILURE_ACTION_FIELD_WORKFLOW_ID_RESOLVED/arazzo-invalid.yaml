arazzo: 1.0.1
info:
  title: Test Arazzo Workflow
  version: 1.0.0
  description: A test document
  summary: Testing failure action workflowId resolution
sourceDescriptions:
  - name: petStore
    type: openapi
    url: ./petstore.yaml
workflows:
  - workflowId: main-workflow
    description: Main workflow
    summary: Main
    steps:
      - stepId: main-step
        description: Main step
        operationId: $sourceDescriptions.petStore.listPets
        successCriteria:
          - condition: $statusCode == 200
        onFailure:
          - name: triggerNonexistent
            type: goto
            workflowId: nonexistent-workflow
          - name: triggerBadSourceRef
            type: goto
            workflowId: $sourceDescriptions.

arazzo: 1.0.1
info:
  title: Sample Arazzo Workflow
  version: 1.0.1
  description: A detailed description
  summary: A sample workflow for testing
sourceDescriptions:
  - name: petStore
    type: openapi
    url: ./petstore-openapi.yaml
workflows:
  - workflowId: create-pet-workflow
    summary: A workflow summary
    description: A workflow description
    steps:
      - stepId: create-pet
        description: A step description
        operationId: $sourceDescriptions.petStore.createPet
        requestBody:
          contentType: application/json
          payload:
            name: Fido
        successCriteria:
          - condition: $statusCode == 201

arazzo: 1.0.1
info:
  title: Test Arazzo Workflow
  version: 1.0.0
  description: A test document
  summary: Testing outputs runtime expressions
sourceDescriptions:
  - name: petStore
    type: openapi
    url: ./petstore.yaml
workflows:
  - workflowId: test-workflow
    description: A test workflow
    summary: Test workflow
    steps:
      - stepId: step-one
        description: Step one
        operationId: $sourceDescriptions.petStore.listPets
        successCriteria:
          - condition: $statusCode == 200
    outputs:
      petName: $response.body#/name
      petId: $steps.step-one.outputs.id

arazzo: 1.0.1
info:
  title: Test Arazzo Workflow
  version: 1.0.0
  description: A test document
  summary: Testing dependsOn resolution
sourceDescriptions:
  - name: petStore
    type: openapi
    url: ./petstore.yaml
  - name: externalArazzo
    type: arazzo
    url: ./external-arazzo.yaml
workflows:
  - workflowId: setup-workflow
    description: Sets up prerequisite data
    summary: Setup workflow
    steps:
      - stepId: setup-step
        description: Perform setup
        operationId: $sourceDescriptions.petStore.setup
        successCriteria:
          - condition: $statusCode == 200
  - workflowId: main-workflow
    description: Main workflow
    summary: Main workflow
    dependsOn:
      - nonexistent-workflow
      - $sourceDescriptions.
    steps:
      - stepId: main-step
        description: Main step
        operationId: $sourceDescriptions.petStore.listPets
        successCriteria:
          - condition: $statusCode == 200

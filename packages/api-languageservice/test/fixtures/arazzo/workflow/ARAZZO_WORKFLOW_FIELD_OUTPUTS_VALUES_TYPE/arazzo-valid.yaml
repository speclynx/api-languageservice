arazzo: 1.0.1
info:
  title: Sample Arazzo Workflow
  version: 1.0.1
  description: A detailed description
  summary: A sample workflow for testing
sourceDescriptions:
  - name: petStore
    type: openapi
    url: ./petstore-openapi.yaml
workflows:
  - workflowId: get-pet-workflow
    summary: A workflow summary
    description: A workflow description
    steps:
      - stepId: get-pet
        description: A step description
        operationId: $sourceDescriptions.petStore.getPetById
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          petName: $response.body#/name
    outputs:
      result: $steps.get-pet.outputs.petName

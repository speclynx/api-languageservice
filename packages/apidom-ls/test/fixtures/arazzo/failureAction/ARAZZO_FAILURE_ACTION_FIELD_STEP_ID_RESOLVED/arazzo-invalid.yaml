arazzo: 1.0.1
info:
  title: Test Arazzo Workflow
  version: 1.0.0
  description: A test document
  summary: Testing failure action stepId resolution
sourceDescriptions:
  - name: petStore
    type: openapi
    url: ./petstore.yaml
workflows:
  - workflowId: main-workflow
    description: Main workflow
    summary: Main
    steps:
      - stepId: step-one
        description: First step
        operationId: $sourceDescriptions.petStore.listPets
        successCriteria:
          - condition: $statusCode == 200
        onFailure:
          - name: retryNonexistent
            type: goto
            stepId: nonexistent-step

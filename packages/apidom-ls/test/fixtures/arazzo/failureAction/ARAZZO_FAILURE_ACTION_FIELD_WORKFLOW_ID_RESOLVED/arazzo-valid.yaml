arazzo: 1.0.1
info:
  title: Test Arazzo Workflow
  version: 1.0.0
  description: A test document
  summary: Testing failure action workflowId resolution
sourceDescriptions:
  - name: petStore
    type: openapi
    url: ./petstore.yaml
  - name: externalArazzo
    type: arazzo
    url: ./external-arazzo.yaml
workflows:
  - workflowId: recovery-workflow
    description: Recovery workflow
    summary: Recovery
    steps:
      - stepId: recover
        description: Recovery step
        operationId: $sourceDescriptions.petStore.recover
        successCriteria:
          - condition: $statusCode == 200
  - workflowId: main-workflow
    description: Main workflow
    summary: Main
    steps:
      - stepId: main-step
        description: Main step
        operationId: $sourceDescriptions.petStore.listPets
        successCriteria:
          - condition: $statusCode == 200
        onFailure:
          - name: triggerRecovery
            type: goto
            workflowId: recovery-workflow
          - name: triggerExternal
            type: goto
            workflowId: $sourceDescriptions.externalArazzo.external-workflow

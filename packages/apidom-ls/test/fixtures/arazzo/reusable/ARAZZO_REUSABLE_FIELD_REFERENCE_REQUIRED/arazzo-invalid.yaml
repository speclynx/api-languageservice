arazzo: 1.0.1
info:
  title: Sample Arazzo Workflow
  version: 1.0.1
sourceDescriptions:
  - name: petStore
    type: openapi
    url: ./petstore-openapi.yaml
workflows:
  - workflowId: get-pet-workflow
    steps:
      - stepId: get-pet
        operationId: $sourceDescriptions.petStore.getPetById
        successCriteria:
          - condition: $statusCode == 200
    parameters:
      - value: override-value
components:
  parameters:
    ApiKey:
      name: apiKey
      in: header
      value: default-key

arazzo: 1.0.1
info:
  title: Sample Arazzo Workflow
  version: 1.0.1
  description: A detailed description
  summary: Reusable Objects carrying fields the Reusable Object does not allow
sourceDescriptions:
  - name: petStore
    type: openapi
    url: ./petstore-openapi.yaml
components:
  parameters:
    ApiKey:
      name: apiKey
      in: header
      value: default-key
  successActions:
    Finish:
      name: finish
      type: end
  failureActions:
    Abort:
      name: abort
      type: end
workflows:
  - workflowId: get-pet-workflow
    summary: A workflow summary
    description: A workflow description
    parameters:
      # not allowed on a Reusable Object
      - reference: $components.parameters.ApiKey
        bogus: x
    successActions:
      # 'name' belongs to a Success Action Object, not a Reusable Object
      - reference: $components.successActions.Finish
        name: finish
    failureActions:
      # 'reference' must be a string (Runtime Expression)
      - reference: 42
    steps:
      - stepId: get-pet
        description: A step description
        operationId: $sourceDescriptions.petStore.getPetById
        successCriteria:
          - condition: $statusCode == 200

arazzo: 1.0.1
sourceDescriptions:
  - name: petStore
    type: openapi
    url: ./petstore-openapi.yaml
workflows:
  - workflowId: get-pet-workflow
    description: A workflow description
    summary: Get a pet by ID
    steps:
      - stepId: get-pet
        description: A step description
        operationId: $sourceDescriptions.petStore.getPetById
        parameters:
          - name: petId
            in: path
            value: 1
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          petName: $response.body.name

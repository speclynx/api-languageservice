arazzo: 1.0.1
info:
  title: Sample Arazzo Workflow
  version: 1.0.1
  summary: A sample workflow for testing
  description: A detailed description of the workflow
sourceDescriptions:
  - name: petStore
    type: openapi
    url: ./petstore-openapi.yaml
workflows:
  - workflowId: get-pet-workflow
    summary: Get a pet by ID
    description: Retrieves a pet from the store by its ID
    steps:
      - stepId: get-pet
        description: Fetch the pet resource
        operationPath: '{$sourceDescriptions.petStore.url}#/paths/~1pets~1{petId}/get'
        parameters:
          - name: petId
            in: path
            value: 1
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          petName: $response.body.name

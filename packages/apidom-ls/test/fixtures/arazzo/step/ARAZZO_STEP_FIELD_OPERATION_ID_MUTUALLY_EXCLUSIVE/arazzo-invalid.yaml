arazzo: 1.0.1
info:
  title: Sample Arazzo Workflow
  version: 1.0.1
sourceDescriptions:
  - name: petStore
    type: openapi
    url: ./petstore-openapi.yaml
workflows:
  - workflowId: test-workflow
    steps:
      - stepId: test-step
        operationId: $sourceDescriptions.petStore.getPetById
        operationPath: '{$sourceDescriptions.petStore.url}#/paths/~1pet~1{petId}/get'
        successCriteria:
          - condition: $statusCode == 200

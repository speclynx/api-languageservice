arazzo: 1.0.1
info:
  title: Test Arazzo Workflow
  version: 1.0.0
  description: A test document
  summary: Testing step workflowId resolution
sourceDescriptions:
  - name: petStore
    type: openapi
    url: ./petstore.yaml
workflows:
  - workflowId: helper-workflow
    description: A helper workflow
    summary: Helper
    steps:
      - stepId: helper-step
        description: Helper step
        operationId: $sourceDescriptions.petStore.listPets
        successCriteria:
          - condition: $statusCode == 200
  - workflowId: main-workflow
    description: Main workflow
    summary: Main
    steps:
      - stepId: call-helper
        description: Calls the helper workflow
        workflowId: helper-workflow
        successCriteria:
          - condition: $statusCode == 200
